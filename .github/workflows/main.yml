name: Build and release JParty

on:
  push:
    tags: ['v*']
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install in a clean build environment
        shell: bash
        run: |
          python -m venv --without-pip .venv-build
          python -m pip --python .venv-build install -r requirements.txt
          python - <<'PYTHON'
          import os
          from pathlib import Path
          directory = Path('.venv-build') / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(directory.resolve()) + '\n')
          PYTHON
      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -q
      - name: Phone client tests
        run: node --test tests/*.cjs
      - name: Select release platforms
        id: platforms
        run: python scripts/release_platforms.py >> "$GITHUB_OUTPUT"

  build:
    needs: test
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Developer ID and validate notarization credentials
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/macos_signing.py install
      - name: Linux build and Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-keysyms1 libxcb-icccm4 libnss3 libpulse0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0
      - name: Install in a clean build environment
        shell: bash
        run: |
          python -m venv --without-pip .venv-build
          python -m pip --python .venv-build install -r requirements.txt
          python - <<'PYTHON'
          import os
          from pathlib import Path
          directory = Path('.venv-build') / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(directory.resolve()) + '\n')
          PYTHON
      - name: Verify platform update installer
        run: python -m unittest discover -s tests -p test_update_installer.py -q
      - name: Build, verify installed executable, and archive
        env:
          JPARTY_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: '1'
        run: python scripts/build_release.py
      - name: Apple notarization diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-${{ matrix.platform }}
          path: dist/releases/*.notarization.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JParty-${{ matrix.platform }}
          path: dist/releases/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: python scripts/macos_signing.py cleanup

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/codex/release-')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify archives and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(python3 -c 'from jparty.version import version; print(version)')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "Release tag must match jparty/version.py" >&2
            exit 1
          fi
          RELEASE_TAG="v$RELEASE_VERSION"
          cd release-assets
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS.txt
          cd ..
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          from jparty.version import version
          from scripts.release_platforms import release_platforms
          for platform in release_platforms(version):
              if not platform['platform'].startswith('macos-'):
                  continue
              arch = platform['platform'].removeprefix('macos-')
              report = json.loads(Path(f'release-assets/JParty-{version}-macos-{arch}.notarization.json').read_text())
              if report.get('status') != 'Accepted' or report.get('stapled') is not True or report.get('gatekeeper') != 'accepted':
                  raise SystemExit(f'Mac {arch} has not passed notarization and Gatekeeper checks')
          PYTHON
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            STATE=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')
            if [[ "$STATE" != $'true\t'"$GITHUB_SHA" ]]; then
              echo "Refusing to replace an existing published release or another commit's draft." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft \
              --title "JParty ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
